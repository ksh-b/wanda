[project]
name = "wanda"
version = "2.0.0"
description = "Set wallpapers with keywords or randomly"
authors = [{ name = "kshib", email = "ksyko@pm.me" }]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ksh-b/wanda"
repository = "https://github.com/ksh-b/wanda"
keywords = ["wallpaper", "wallhaven", "earthview", "termux"]
requires-python = ">=3.11,<4.0.0"
dependencies = [
    "lxml (>=6.1.1,<7.0.0)",
    "cloudscraper-enhanced (>=3.0.0,<4.0.0)",
    "Pillow (>=12.2.0,<13.0.0)",
    "screeninfo (>=0.8.1,<1.0.0)",
    "colorthief-v3 (>=3.3.1,<4.0.0)",
    "filetype (>=1.2.0,<2.0.0)",
    "musicbrainzngs (>=0.7.1,<1.0.0)",
    "appdirs (>=1.4.4,<2.0.0)",
]

[project.urls]
"Bug Tracker" = "https://github.com/ksh-b/wanda/issues"

[build-system]
requires = ["poetry-core>=2.4.1"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
wanda = "wanda.wanda:run"

[dependency-groups]
dev = [
    "pytest (>=9.1.0,<10.0.0)",
    "ruff (>=0.15.17,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-rerunfailures (>=16.3,<17.0)"
]
